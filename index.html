<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101020">
<meta name="description" content="AI Genius - Your personal AI workspace">
<title>AI Genius</title>

<style>
:root {
  color-scheme: dark;
  --bg: #101020;
  --panel: #19192d;
  --panel2: #22223b;
  --border: #343451;
  --text: #f8f7ff;
  --muted: #aaaac4;
  --accent: #9065f5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 system-ui, Arial, sans-serif;
}
button, textarea { font: inherit; }
button { cursor: pointer; color: inherit; }
button:disabled { opacity: .6; cursor: wait; }

header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.logo { font-size: 22px; font-weight: 800; }
.logo span { color: #a78bfa; }
.header-actions { display: flex; gap: 8px; }

button {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 12px;
  background: var(--panel2);
}
.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
  font-weight: 700;
}
main {
  max-width: 850px;
  margin: auto;
  padding: 18px 12px 150px;
}
.hero { text-align: center; padding: 18px 0; }
.hero h1 { font-size: clamp(28px, 7vw, 42px); margin: 0 0 8px; }
.muted, .note { color: var(--muted); }
.tools {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 15px 0;
}
.tool {
  text-align: left;
  padding: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.tool.active { border-color: var(--accent); }
.tool strong, .tool small { display: block; }
.tool small { color: var(--muted); }
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 13px;
  margin: 12px 0;
}
.section-title { font-size: 16px; margin: 5px 0 12px; }

#chatMessages {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 100px;
  padding: 5px 0 15px;
}
.message {
  max-width: 95%;
  padding: 12px 14px;
  border-radius: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.message.user {
  align-self: flex-end;
  background: var(--accent);
  color: white;
  border-bottom-right-radius: 4px;
}
.message.assistant {
  align-self: flex-start;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.message-label {
  font-size: 11px;
  font-weight: 700;
  opacity: .8;
  margin-bottom: 5px;
}
.message-content { white-space: pre-wrap; }

.composer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 9;
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 10px;
}
.composer-inner { max-width: 850px; margin: auto; }
#prompt {
  width: 100%;
  min-height: 55px;
  max-height: 180px;
  resize: vertical;
  padding: 12px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  outline-color: var(--accent);
}
.composer-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.composer-actions .primary { flex: 1; }
.note { font-size: 12px; margin: 8px 0; }
.history-item {
  border-bottom: 1px solid var(--border);
  padding: 10px 0;
  overflow-wrap: anywhere;
}
.history-actions { display: flex; gap: 7px; margin-top: 7px; }
.history-actions button { padding: 6px 9px; }
#result { display: none; }
[hidden] { display: none !important; }

body.light {
  color-scheme: light;
  --bg: #f5f5fc;
  --panel: #ffffff;
  --panel2: #ededfa;
  --border: #deddec;
  --text: #202039;
  --muted: #676782;
}
@media (min-width: 600px) {
  .tools { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  main { padding-top: 25px; }
}
</style>
</head>

<body>
<header>
  <div class="logo">✨ AI <span>Genius</span></div>
  <div class="header-actions">
    <button id="newChat" type="button">＋ New Chat</button>
    <button id="themeBtn" type="button" aria-label="Toggle theme">☀️</button>
  </div>
</header>

<main>
  <section class="hero" id="welcome">
    <h1>What can we create?</h1>
    <p class="muted">Your ideas, questions and AI conversations in one place.</p>
  </section>

  <h2 class="section-title">Choose your AI tool</h2>
  <section class="tools">
    <button class="tool active" data-mode="chat" type="button">
      <strong>💬 AI Chat</strong><small>Questions and answers</small>
    </button>
    <button class="tool" data-mode="write" type="button">
      <strong>✍️ AI Writer</strong><small>Writing and captions</small>
    </button>
    <button class="tool" data-mode="image" type="button">
      <strong>🎨 Image Studio</strong><small>Image prompts</small>
    </button>
    <button class="tool" data-mode="ideas" type="button">
      <strong>💡 Idea Generator</strong><small>Ideas and plans</small>
    </button>
    <button class="tool" data-mode="video" type="button">
      <strong>🎬 Video Studio</strong><small>Video prompts</small>
    </button>
    <button class="tool" data-mode="voice" type="button">
      <strong>🎙️ Voice Assistant</strong><small>Voice tools</small>
    </button>
  </section>

  <section class="panel">
    <div id="chatMessages" aria-live="polite">
      <div class="message assistant">
        <div class="message-label">AI Genius</div>
        <div class="message-content">Hello! I'm AI Genius. How can I help you today?</div>
      </div>
    </div>
    <div id="result"></div>
    <p class="note" id="note">Ready.</p>
  </section>

  <section class="panel">
    <h2 class="section-title">🕘 Recent Conversations</h2>
    <div id="historyList">
      <p class="note">Your saved conversations will appear here.</p>
    </div>
    <button id="clearHistory" type="button">Clear History</button>
    <button id="exportHistory" type="button">Export History</button>
  </section>

  <section class="panel">
    <h2 class="section-title">⚙️ Voice Settings</h2>
    <label for="language">Voice language</label>
    <select id="language">
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="ur-PK">Urdu (Pakistan)</option>
      <option value="hi-IN">Hindi</option>
    </select>
    <br><br>
    <label for="voiceRate">Speech speed</label>
    <select id="voiceRate">
      <option value="0.8">Slow</option>
      <option value="1" selected>Normal</option>
      <option value="1.2">Fast</option>
    </select>
    <div class="composer-actions">
      <button id="speakReply" type="button">🔊 Read Last Reply</button>
      <button id="stopVoice" type="button">⏹ Stop Voice</button>
    </div>
  </section>
</main>

<section class="composer">
  <div class="composer-inner">
    <textarea id="prompt" maxlength="12000" placeholder="Message AI Genius..." aria-label="Your message"></textarea>
    <div class="composer-actions">
      <button id="voiceInput" type="button">🎙️ Speak</button>
      <button id="clear" type="button">Clear</button>
      <button id="generate" class="primary" type="button">Send ↑</button>
    </div>
  </div>
</section>

<script>
"use strict";

const WORKER_URL = "https://ai-genius.emaillogin100-n.workers.dev";
const $ = id => document.getElementById(id);

const promptBox = $("prompt");
const chatMessages = $("chatMessages");
const historyList = $("historyList");
const generate = $("generate");
const note = $("note");
const voiceInput = $("voiceInput");

let mode = "chat";
let recognition = null;
let controller = null;
let speechRun = 0;
let conversations = [];
let currentConversationId = null;
let messages = [];

const instructions = {
  chat: "",
  write: "Act as a professional AI writer. Match the requested language, format and tone.\n\n",
  image: "Create a detailed image-generation prompt. Include the subject, setting, composition, lighting, colors and style. Do not claim an image was generated unless an actual image is returned.\n\n",
  ideas: "Generate several original, practical ideas and explain useful next steps.\n\n",
  video: "Create a detailed cinematic video-generation prompt including scene, action, camera movement, lighting, duration and aspect ratio.\n\n",
  voice: ""
};

function setNote(text) {
  note.textContent = text;
}

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function saveConversations() {
  try {
    localStorage.setItem("aiGeniusConversationsV2", JSON.stringify(conversations.slice(0, 50)));
  } catch (_) {
    setNote("Browser storage unavailable. Conversations may not be saved.");
  }
}

function loadConversations() {
  try {
    const stored = JSON.parse(localStorage.getItem("aiGeniusConversationsV2") || "[]");
    conversations = Array.isArray(stored) ? stored.filter(c =>
      c && typeof c.id === "string" && Array.isArray(c.messages)
    ).slice(0, 50) : [];
  } catch (_) {
    conversations = [];
  }

  if (conversations.length) {
    openConversation(conversations[0].id, false);
  } else {
    startNewChat(false);
  }
  renderHistory();
}

function currentConversation() {
  return conversations.find(c => c.id === currentConversationId) || null;
}

function startNewChat(showNote = true) {
  if (controller) {
    controller.abort();
    controller = null;
  }

  currentConversationId = makeId();
  messages = [];
  mode = "chat";
  updateActiveTool();
  chatMessages.replaceChildren();
  addMessage("assistant", "Hello! I'm AI Genius. How can I help you today?", false);
  promptBox.value = "";
  setNote(showNote ? "New chat started." : "Ready.");
  renderHistory();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function addMessage(role, content, persist = true) {
  const message = {
    role,
    content: String(content),
    time: new Date().toISOString()
  };
  messages.push(message);

  const bubble = document.createElement("div");
  bubble.className = "message " + (role === "user" ? "user" : "assistant");

  const label = document.createElement("div");
  label.className = "message-label";
  label.textContent = role === "user" ? "You" : "AI Genius";

  const body = document.createElement("div");
  body.className = "message-content";
  body.textContent = message.content;

  bubble.append(label, body);
  chatMessages.appendChild(bubble);
  chatMessages.scrollIntoView({ block: "end", behavior: "smooth" });
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

  if (persist) saveCurrentConversation();
  return message;
}

function saveCurrentConversation() {
  if (!currentConversationId) currentConversationId = makeId();

  let conversation = currentConversation();
  if (!conversation) {
    conversation = {
      id: currentConversationId,
      title: "New conversation",
      mode,
      messages: [],
      updatedAt: new Date().toISOString()
    };
    conversations.unshift(conversation);
  }

  conversation.messages = messages.slice(-100);
  conversation.mode = mode;
  conversation.updatedAt = new Date().toISOString();

  const firstUser = messages.find(m => m.role === "user");
  conversation.title = firstUser
    ? firstUser.content.slice(0, 70)
    : "New conversation";

  conversations = conversations.filter(c => c.id !== currentConversationId)
    .concat(conversation);

  conversations.sort((a, b) =>
    new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0)
  );
  conversations = conversations.slice(0, 50);
  saveConversations();
  renderHistory();
}

function openConversation(id, scroll = true) {
  const conversation = conversations.find(c => c.id === id);
  if (!conversation) return;

  if (controller) {
    controller.abort();
    controller = null;
  }

  currentConversationId = conversation.id;
  messages = Array.isArray(conversation.messages)
    ? conversation.messages.map(m => ({
        role: m.role === "user" ? "user" : "assistant",
        content: String(m.content || ""),
        time: m.time || ""
      }))
    : [];

  mode = conversation.mode || "chat";
  updateActiveTool();
  chatMessages.replaceChildren();

  if (!messages.length) {
    addMessage("assistant", "This conversation is empty. Send a message to begin.", false);
  } else {
    messages.forEach(message => {
      const bubble = document.createElement("div");
      bubble.className = "message " + message.role;

      const label = document.createElement("div");
      label.className = "message-label";
      label.textContent = message.role === "user" ? "You" : "AI Genius";

      const body = document.createElement("div");
      body.className = "message-content";
      body.textContent = message.content;

      bubble.append(label, body);
      chatMessages.appendChild(bubble);
    });
  }

  promptBox.value = "";
  setNote("Conversation opened.");
  renderHistory();

  if (scroll) {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }
}

function renderHistory() {
  historyList.replaceChildren();

  if (!conversations.length) {
    const p = document.createElement("p");
    p.className = "note";
    p.textContent = "Your saved conversations will appear here.";
    historyList.appendChild(p);
    return;
  }

  conversations.forEach(conversation => {
    const row = document.createElement("div");
    row.className = "history-item";

    const title = document.createElement("strong");
    title.textContent = conversation.title || "Conversation";

    const meta = document.createElement("div");
    meta.className = "note";
    const count = (conversation.messages || []).filter(m => m.role === "user").length;
    meta.textContent = count + " message(s) · " +
      (conversation.updatedAt ? new Date(conversation.updatedAt).toLocaleString() : "");

    const actions = document.createElement("div");
    actions.className = "history-actions";

    const open = document.createElement("button");
    open.type = "button";
    open.textContent = "Open";
    open.addEventListener("click", () => openConversation(conversation.id));

    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "Delete";
    remove.addEventListener("click", () => {
      conversations = conversations.filter(c => c.id !== conversation.id);
      if (currentConversationId === conversation.id) {
        startNewChat();
      } else {
        saveConversations();
        renderHistory();
      }
    });

    actions.append(open, remove);
    row.append(title, meta, actions);
    historyList.appendChild(row);
  });
}

function updateActiveTool() {
  document.querySelectorAll(".tool").forEach(button => {
    button.classList.toggle("active", button.dataset.mode === mode);
  });
}

document.querySelectorAll(".tool").forEach(button => {
  button.addEventListener("click", () => {
    mode = button.dataset.mode;
    updateActiveTool();
    setNote("Selected " + button.querySelector("strong").textContent + ".");
  });
});

async function sendMessage() {
  const text = promptBox.value.trim();

  if (!text) {
    setNote("Please type a message first.");
    promptBox.focus();
    return;
  }

  if (controller) controller.abort();
  controller = new AbortController();
  const requestController = controller;
  const submittedMode = mode;

  promptBox.value = "";
  addMessage("user", text);
  saveCurrentConversation();

  generate.disabled = true;
  voiceInput.disabled = true;
  generate.textContent = "Thinking...";
  setNote("Connecting to AI Genius...");

  const pending = document.createElement("div");
  pending.className = "message assistant";
  pending.id = "pendingMessage";
  pending.textContent = "AI Genius is thinking...";
  chatMessages.appendChild(pending);

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: (instructions[submittedMode] || "") + text,
        mode: submittedMode
      }),
      signal: requestController.signal
    });

    let data;
    try {
      data = await response.json();
    } catch (_) {
      throw new Error("The AI service returned an invalid response.");
    }

    if (!response.ok || data.success === false) {
      throw new Error(data.error || "Request failed (" + response.status + ").");
    }

    const reply = data.reply ?? data.response ?? data.output ?? data.text ?? "";

    if (typeof reply !== "string" || !reply.trim()) {
      throw new Error("No text response received from the Worker.");
    }

    pending.remove();
    addMessage("assistant", reply);
    saveCurrentConversation();
    setNote("AI Genius response received.");
  } catch (error) {
    pending.remove();

    if (error.name === "AbortError") {
      setNote("Request cancelled.");
    } else {
      addMessage("assistant", "Sorry, I couldn't get a response. " +
        (error.message || "Please try again."));
      setNote("Connection error. Check your Cloudflare Worker.");
      console.error("AI Genius error:", error);
    }
  } finally {
    if (controller === requestController) controller = null;
    generate.disabled = false;
    voiceInput.disabled = false;
    generate.textContent = "Send ↑";
    promptBox.focus();
  }
}

generate.addEventListener("click", sendMessage);

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

$("newChat").addEventListener("click", () => startNewChat());

$("clear").addEventListener("click", () => {
  promptBox.value = "";
  promptBox.focus();
  setNote("Message box cleared.");
});

$("clearHistory").addEventListener("click", () => {
  if (!confirm("Delete all saved conversations on this device?")) return;
  conversations = [];
  try {
    localStorage.removeItem("aiGeniusConversationsV2");
  } catch (_) {}
  startNewChat();
  renderHistory();
  setNote("All saved conversations deleted.");
});

$("exportHistory").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(conversations, null, 2)], {
    type: "application/json"
  });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "ai-genius-conversations.json";
  link.click();
  URL.revokeObjectURL(url);
  setNote("Conversation history exported.");
});

$("themeBtn").addEventListener("click", () => {
  document.body.classList.toggle("light");
  const light = document.body.classList.contains("light");
  $("themeBtn").textContent = light ? "🌙" : "☀️";
  try {
    localStorage.setItem("aiGeniusTheme", light ? "light" : "dark");
  } catch (_) {}
});

if (localStorage.getItem("aiGeniusTheme") === "light") {
  document.body.classList.add("light");
  $("themeBtn").textContent = "🌙";
}

$("speakReply").addEventListener("click", () => {
  const lastReply = [...messages].reverse().find(m => m.role === "assistant");
  if (!lastReply) {
    setNote("There is no reply to read yet.");
    return;
  }
  if (!("speechSynthesis" in window)) {
    setNote("Voice playback is not supported in this browser.");
    return;
  }

  speechSynthesis.cancel();
  const run = ++speechRun;
  const utterance = new SpeechSynthesisUtterance(lastReply.content);
  utterance.lang = $("language").value;
  utterance.rate = Number($("voiceRate").value) || 1;
  utterance.onend = () => {
    if (run === speechRun) setNote("Finished reading the reply.");
  };
  speechSynthesis.speak(utterance);
});

$("stopVoice").addEventListener("click", () => {
  speechRun++;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (recognition) {
    try { recognition.abort(); } catch (_) {}
    recognition = null;
  }
  voiceInput.textContent = "🎙️ Speak";
  setNote("Voice stopped.");
});

voiceInput.addEventListener("click", () => {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    setNote("Voice input is not supported here. Please type your message.");
    return;
  }

  if (recognition) {
    try { recognition.abort(); } catch (_) {}
  }

  const current = new SpeechRecognition();
  recognition = current;
  current.lang = $("language").value;
  current.interimResults = false;
  current.maxAlternatives = 1;

  current.onstart = () => {
    voiceInput.textContent = "Listening...";
    setNote("Listening. Speak clearly.");
  };

  current.onresult = event => {
    const spoken = event.results[0][0].transcript;
    promptBox.value = promptBox.value.trim()
      ? promptBox.value.trim() + " " + spoken
      : spoken;
  };

  current.onerror = event => setNote("Voice input error: " + event.error);

  current.onend = () => {
    if (recognition === current) recognition = null;
    voiceInput.textContent = "🎙️ Speak";
  };

  try {
    current.start();
  } catch (_) {
    recognition = null;
    voiceInput.textContent = "🎙️ Speak";
    setNote("Could not start voice input. Try again.");
  }
});

loadConversations();
</script>
</body>
</html>
