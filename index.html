<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101020">
  <title>AI Genius</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101020;
      color: #fff;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #292942;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .logo { font-size: 23px; font-weight: bold; }
    .logo span { color: #a78bfa; }

    .badge {
      color: #c4b5fd;
      border: 1px solid #514477;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
    }

    main {
      max-width: 760px;
      margin: auto;
      padding: 30px 16px;
    }

    .hero { text-align: center; margin: 22px 0 30px; }
    .hero h1 { font-size: clamp(30px, 7vw, 48px); }

    .hero h1 span {
      background: linear-gradient(90deg, #a78bfa, #67e8f9);
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
    }

    .hero p, .note { color: #a6a6c3; line-height: 1.6; }

    .tools {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .tool {
      background: #19192d;
      border: 1px solid #30304b;
      border-radius: 14px;
      padding: 17px 12px;
      color: white;
      text-align: left;
      cursor: pointer;
    }

    .tool.active {
      border-color: #a78bfa;
      background: #25203d;
    }

    .emoji { font-size: 24px; display: block; margin-bottom: 10px; }
    .tool strong { display: block; margin-bottom: 5px; }
    .tool small { color: #aaaac4; }

    .panel {
      background: #19192d;
      border: 1px solid #30304b;
      border-radius: 16px;
      padding: 18px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 115px;
      resize: vertical;
      background: #101020;
      color: white;
      border: 1px solid #383854;
      border-radius: 10px;
      padding: 14px;
      font: inherit;
      line-height: 1.5;
    }

    textarea:focus { outline: 1px solid #a78bfa; }

    .actions { display: flex; gap: 10px; margin-top: 12px; }
    button { font: inherit; }
    button:disabled { opacity: .6; cursor: wait; }

    .primary {
      flex: 1;
      padding: 13px;
      background: #8b5cf6;
      color: white;
      border: 0;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary {
      padding: 13px;
      background: #292942;
      color: white;
      border: 1px solid #424260;
      border-radius: 10px;
      cursor: pointer;
    }

    #result {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
      color: #e0e0f3;
      margin-top: 18px;
    }

    .note { font-size: 13px; }

    footer {
      text-align: center;
      padding: 25px;
      color: #8585a5;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      .tools { grid-template-columns: 1fr; }
      .badge { font-size: 10px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">✨ AI <span>Genius</span></div>
    <div class="badge">YOUR AI WORKSPACE</div>
  </header>

  <main>
    <section class="hero">
      <h1>What can we <span>create?</span></h1>
      <p>Your creative workspace for AI chat, writing, ideas and image prompts.</p>
    </section>

    <section class="tools" aria-label="AI tools">
      <button type="button" class="tool active" data-mode="chat">
        <span class="emoji">💬</span>
        <strong>AI Chat</strong>
        <small>Ask questions and explore ideas</small>
      </button>

      <button type="button" class="tool" data-mode="write">
        <span class="emoji">✍️</span>
        <strong>AI Writer</strong>
        <small>Draft posts, stories and captions</small>
      </button>

      <button type="button" class="tool" data-mode="image">
        <span class="emoji">🎨</span>
        <strong>Image Prompts</strong>
        <small>Create prompts for artwork</small>
      </button>

      <button type="button" class="tool" data-mode="ideas">
        <span class="emoji">💡</span>
        <strong>Idea Generator</strong>
        <small>Discover new possibilities</small>
      </button>
    </section>

    <section class="panel">
      <label id="promptLabel" for="prompt">
        What would you like help with?
      </label>

      <textarea id="prompt"
        placeholder="Type your question or idea here..."></textarea>

      <div class="actions">
        <button type="button" class="primary" id="generate">
          Generate
        </button>
        <button type="button" class="secondary" id="clear">
          Clear
        </button>
      </div>

      <div id="result" role="status" aria-live="polite"></div>

      <p class="note" id="note">
        AI Genius is ready to help. Enter a prompt to get started.
      </p>
    </section>
  </main>

  <footer>AI Genius · Built for your ideas</footer>

  <script>
    const WORKER_URL =
      "https://ai-genius.emaillogin100-n.workers.dev";

    const tools = document.querySelectorAll(".tool");
    const promptBox = document.getElementById("prompt");
    const result = document.getElementById("result");
    const label = document.getElementById("promptLabel");
    const generate = document.getElementById("generate");
    const clear = document.getElementById("clear");
    const note = document.getElementById("note");

    let mode = "chat";

    const labels = {
      chat: "What would you like help with?",
      write: "What would you like to write?",
      image: "Describe the image you imagine",
      ideas: "What topic do you need ideas for?"
    };

    tools.forEach(tool => {
      tool.addEventListener("click", () => {
        tools.forEach(item => item.classList.remove("active"));
        tool.classList.add("active");

        mode = tool.dataset.mode;
        label.textContent = labels[mode];
        promptBox.placeholder = labels[mode];
        result.textContent = "";
      });
    });

    generate.addEventListener("click", async () => {
      const text = promptBox.value.trim();

      if (!text) {
        result.textContent = "Please enter a prompt first.";
        promptBox.focus();
        return;
      }

      generate.disabled = true;
      clear.disabled = true;
      generate.textContent = "Generating...";
      result.textContent = "Connecting to AI Genius...";
      note.textContent = "Please wait for the response.";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: text,
            mode: mode
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Request failed with status " + response.status
          );
        }

        const reply =
          data.reply ??
          data.response ??
          data.output ??
          data.text;

        if (typeof reply !== "string" || !reply.trim()) {
          throw new Error(
            data.error || "The worker returned no readable reply."
          );
        }

        result.textContent = reply;
        note.textContent = "Response generated by AI Genius.";
      } catch (error) {
        result.textContent =
          "Sorry, we couldn't get a response. Please try again.";

        note.textContent =
          "Connection error: " + (error.message || "Unknown error");

        console.error("AI Genius error:", error);
      } finally {
        generate.disabled = false;
        clear.disabled = false;
        generate.textContent = "Generate";
      }
    });

    clear.addEventListener("click", () => {
      promptBox.value = "";
      result.textContent = "";
      note.textContent = "Enter a prompt to get started.";
      promptBox.focus();
    });
  </script>
</body>
</html>
