<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101020">
<title>AI Genius</title>

<style>
:root {
  color-scheme: dark;
  --bg:#101020;
  --panel:#19192d;
  --panel2:#24243b;
  --border:#343451;
  --text:#f8f7ff;
  --muted:#aaaac4;
  --accent:#9065f5;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.55 system-ui,-apple-system,Arial,sans-serif;
}
button,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px
}
header{
  height:60px;display:flex;align-items:center;gap:12px;
  padding:0 16px;border-bottom:1px solid var(--border);
  background:var(--bg);position:relative;z-index:20
}
.logo{font-size:21px;font-weight:850;white-space:nowrap}
.logo span{color:#a78bfa}
.icon-btn,.btn{
  border:1px solid var(--border);background:var(--panel2);
  border-radius:10px;padding:9px 12px
}
.icon-btn{font-size:19px;padding:5px 11px}
.header-right{margin-left:auto;display:flex;gap:8px}
.layout{display:flex;height:calc(100dvh - 60px);min-height:400px}
.sidebar{
  width:260px;flex-shrink:0;background:var(--panel);
  border-right:1px solid var(--border);padding:13px;
  overflow-y:auto;display:flex;flex-direction:column;gap:9px
}
.new-chat{
  width:100%;text-align:left;padding:12px;
  border:1px solid var(--border);border-radius:12px;
  background:var(--panel2);font-weight:700
}
.side-heading{
  color:var(--muted);font-size:11px;font-weight:800;
  letter-spacing:1px;margin:13px 5px 3px
}
.tool{
  width:100%;display:flex;align-items:center;gap:10px;
  text-align:left;padding:10px;border:1px solid transparent;
  background:transparent;border-radius:10px
}
.tool:hover,.side-link:hover{background:var(--panel2)}
.tool.active{background:var(--panel2);border-color:var(--accent)}
.tool-icon{width:25px;text-align:center;font-size:18px}
.side-link{
  width:100%;display:block;text-align:left;
  padding:10px;border:0;background:transparent;border-radius:9px
}
.side-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:10px}
.side-panel{padding:10px 0;border-bottom:1px solid var(--border)}
.side-panel summary{cursor:pointer;font-weight:700;padding:6px}
.side-panel label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
.side-panel select{
  width:100%;padding:9px;border-radius:9px;
  color:var(--text);background:var(--bg);border:1px solid var(--border)
}
.history-item{padding:9px 5px;border-bottom:1px solid var(--border)}
.history-title{
  display:block;width:100%;border:0;background:transparent;
  text-align:left;padding:5px 0;overflow-wrap:anywhere
}
.history-actions{display:flex;gap:6px;margin-top:5px}
.history-actions button{font-size:12px;padding:5px 8px}
.note{font-size:12px;color:var(--muted);margin:7px 0;overflow-wrap:anywhere}
.main{
  flex:1;min-width:0;display:flex;flex-direction:column;
  position:relative
}
.chat-top{
  padding:10px 18px;border-bottom:1px solid var(--border);
  color:var(--muted);font-size:13px
}
#chatMessages{
  flex:1;min-height:0;overflow-y:auto;
  padding:24px 16px 30px;scroll-behavior:smooth
}
.welcome{
  max-width:650px;margin:9vh auto 30px;text-align:center
}
.welcome h1{font-size:clamp(28px,5vw,42px);margin:0 0 10px}
.gradient{
  background:linear-gradient(90deg,#b39aff,#55d8e9);
  background-clip:text;color:transparent
}
.welcome p{color:var(--muted)}
.message-row{display:flex;margin:0 auto 22px;max-width:780px}
.message-row.user{justify-content:flex-end}
.message{
  max-width:min(90%,680px);padding:12px 16px;
  border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere;
  line-height:1.75
}
.message.user{
  background:var(--accent);color:white;
  border-bottom-right-radius:5px
}
.message.assistant{
  background:var(--panel);border:1px solid var(--border);
  border-bottom-left-radius:5px
}
.message-label{font-size:11px;font-weight:800;opacity:.75;margin-bottom:4px}
.message-content{white-space:pre-wrap}
.composer-area{
  padding:12px 16px 14px;border-top:1px solid var(--border);
  background:var(--bg)
}
.composer-inner{max-width:780px;margin:auto}
#prompt{
  display:block;width:100%;min-height:54px;max-height:180px;
  resize:vertical;padding:13px 14px;border-radius:15px;
  border:1px solid var(--border);background:var(--panel);
  color:var(--text);line-height:1.5
}
.composer-actions{display:flex;align-items:center;gap:8px;margin-top:8px}
.composer-actions .spacer{flex:1}
.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:750}
#sendBtn{min-width:85px}
#status{font-size:12px;color:var(--muted);margin-top:7px}
.overlay{display:none}
[hidden]{display:none!important}
body.light{
  color-scheme:light;--bg:#f5f5fc;--panel:#fff;--panel2:#ededfa;
  --border:#deddec;--text:#202039;--muted:#676782
}
@media(max-width:760px){
  header{padding:0 11px}
  .sidebar{
    position:fixed;top:60px;bottom:0;left:0;z-index:30;
    width:min(290px,85vw);transform:translateX(-105%);
    transition:transform .2s ease;box-shadow:none
  }
  body.sidebar-open .sidebar{transform:translateX(0);box-shadow:12px 0 40px #0005}
  .overlay{
    position:fixed;inset:60px 0 0;z-index:25;
    background:#0008
  }
  body.sidebar-open .overlay{display:block}
  #chatMessages{padding:18px 12px 22px}
  .composer-area{padding:10px}
  .welcome{margin-top:8vh}
  .message{max-width:95%}
}
@media(min-width:761px){
  #menuBtn{display:none}
}
</style>
</head>

<body>
<header>
  <button class="icon-btn" id="menuBtn" aria-label="Open sidebar">☰</button>
  <div class="logo">✨ AI <span>Genius</span></div>
  <div class="header-right">
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">☀️</button>
    <button class="btn" id="headerNewChat">＋ New Chat</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <button class="new-chat" id="newChat">＋ New chat</button>

    <div class="side-heading">AI TOOLS</div>
    <button class="tool active" data-mode="chat"><span class="tool-icon">💬</span>AI Chat</button>
    <button class="tool" data-mode="write"><span class="tool-icon">✍️</span>AI Writer</button>
    <button class="tool" data-mode="image"><span class="tool-icon">🎨</span>Image Studio</button>
    <button class="tool" data-mode="ideas"><span class="tool-icon">💡</span>Idea Generator</button>
    <button class="tool" data-mode="video"><span class="tool-icon">🎬</span>Video Studio</button>
    <button class="tool" data-mode="voice"><span class="tool-icon">🎙️</span>Voice Assistant</button>

    <div class="side-heading">YOUR WORKSPACE</div>
    <button class="side-link" id="historyJump">🕘 Recent conversations</button>
    <div id="historyList"></div>
    <button class="side-link" id="exportHistory">📥 Export conversations</button>
    <button class="side-link" id="clearHistory">🗑️ Clear all history</button>

    <div class="side-bottom">
      <details class="side-panel">
        <summary>⚙️ Voice settings</summary>
        <label for="language">Voice language</label>
        <select id="language">
          <option value="en-US">English (US)</option>
          <option value="en-GB">English (UK)</option>
          <option value="ur-PK">Urdu (Pakistan)</option>
          <option value="hi-IN">Hindi</option>
        </select>
        <label for="voiceRate">Speech speed</label>
        <select id="voiceRate">
          <option value="0.8">Slow</option>
          <option value="1" selected>Normal</option>
          <option value="1.2">Fast</option>
        </select>
        <button class="side-link" id="speakReply">🔊 Read last reply</button>
        <button class="side-link" id="stopVoice">⏹ Stop voice</button>
      </details>

      <details class="side-panel">
        <summary>⭐ Plans</summary>
        <p class="note">Free: PKR 0</p>
        <p class="note">Plan upgrades are not connected yet.</p>
      </details>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <div class="chat-top" id="modeTitle">AI Chat</div>

    <section id="chatMessages" aria-live="polite">
      <div class="welcome" id="welcome">
        <h1>Hello, <span class="gradient">I'm AI Genius</span></h1>
        <p>Your AI assistant. What would you like to work on today?</p>
      </div>
    </section>

    <div class="composer-area">
      <div class="composer-inner">
        <textarea id="prompt" rows="2" placeholder="Message AI Genius..." aria-label="Message AI Genius"></textarea>
        <div class="composer-actions">
          <button class="btn" id="micBtn" title="Voice input">🎙️</button>
          <button class="btn" id="clearBtn">Clear</button>
          <span class="spacer"></span>
          <button class="btn primary" id="sendBtn">Send ↑</button>
        </div>
        <div id="status" role="status">AI Genius can make mistakes. Check important information.</div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
"use strict";

const WORKER_URL = "https://ai-genius.emaillogin100-n.workers.dev";
const STORAGE_KEY = "aiGeniusConversationsV2";
const $ = id => document.getElementById(id);

const instructions = {
  chat: "",
  write: "Act as a helpful writing assistant. Write clearly and improve the user's text when requested.\n\n",
  image: "Help the user create detailed image-generation prompts. If image generation is not available through the connected service, provide a ready-to-use prompt instead. Do not claim an image was generated unless one was actually returned.\n\n",
  ideas: "Act as a creative brainstorming assistant. Give original, practical ideas with useful details.\n\n",
  video: "Act as a video-planning assistant. Help with scripts, storyboards, scenes, and video-generation prompts. Do not claim to render a video unless the service actually returns one.\n\n",
  voice: "Act as a conversational voice assistant. Reply naturally and concisely, suitable for being read aloud.\n\n"
};

const modeNames = {
  chat: "AI Chat",
  write: "AI Writer",
  image: "Image Studio",
  ideas: "Idea Generator",
  video: "Video Studio",
  voice: "Voice Assistant"
};

let mode = "chat";
let messages = [];
let currentId = createId();
let conversations = loadHistory();
let busy = false;
let recognition = null;
let lastReply = "";

function createId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function loadHistory() {
  try {
    const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(value) ? value : [];
  } catch {
    return [];
  }
}

function persistHistory() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations.slice(0, 50)));
  } catch {
    setStatus("Browser storage is unavailable. Your chat may not be saved.");
  }
}

function setStatus(text) {
  $("status").textContent = text;
}

function closeSidebar() {
  document.body.classList.remove("sidebar-open");
}

function toggleSidebar() {
  document.body.classList.toggle("sidebar-open");
}

function updateMode(nextMode) {
  if (!instructions[nextMode]) return;
  mode = nextMode;
  document.querySelectorAll(".tool").forEach(button => {
    button.classList.toggle("active", button.dataset.mode === mode);
  });
  $("modeTitle").textContent = modeNames[mode];
  $("prompt").placeholder = "Message " + modeNames[mode] + "...";
  closeSidebar();
  $("prompt").focus();
}

function showWelcome() {
  $("chatMessages").replaceChildren();
  const welcome = document.createElement("div");
  welcome.className = "welcome";
  welcome.id = "welcome";

  const title = document.createElement("h1");
  title.append("Hello, ");
  const span = document.createElement("span");
  span.className = "gradient";
  span.textContent = "I'm AI Genius";
  title.append(span);

  const description = document.createElement("p");
  description.textContent = "Your AI assistant. What would you like to work on today?";

  welcome.append(title, description);
  $("chatMessages").append(welcome);
}

function addMessage(role, content, save = true) {
  const text = String(content ?? "");
  const welcome = $("welcome");
  if (welcome) welcome.remove();

  const row = document.createElement("div");
  row.className = "message-row " + (role === "user" ? "user" : "assistant");

  const bubble = document.createElement("div");
  bubble.className = "message " + (role === "user" ? "user" : "assistant");

  const label = document.createElement("div");
  label.className = "message-label";
  label.textContent = role === "user" ? "YOU" : "AI GENIUS";

  const body = document.createElement("div");
  body.className = "message-content";
  body.textContent = text;

  bubble.append(label, body);
  row.append(bubble);
  $("chatMessages").append(row);
  $("chatMessages").scrollTop = $("chatMessages").scrollHeight;

  messages.push({ role, content: text, time: Date.now() });
  if (role === "assistant") lastReply = text;
  if (save) saveCurrentConversation();
  return row;
}

function conversationTitle(items) {
  const first = items.find(item => item.role === "user");
  if (!first) return "New conversation";
  const title = first.content.replace(/\s+/g, " ").trim();
  return title.length > 42 ? title.slice(0, 42) + "…" : title;
}

function saveCurrentConversation() {
  if (!messages.length) return;

  const existing = conversations.find(item => item.id === currentId);
  const conversation = {
    id: currentId,
    title: conversationTitle(messages),
    mode,
    updatedAt: Date.now(),
    messages: messages.slice(-100)
  };

  conversations = conversations.filter(item => item.id !== currentId);
  conversations.unshift(conversation);
  conversations = conversations.slice(0, 50);
  persistHistory();
  renderHistory();
}

function renderHistory() {
  const list = $("historyList");
  list.replaceChildren();

  if (!conversations.length) {
    const empty = document.createElement("p");
    empty.className = "note";
    empty.textContent = "Your recent chats will appear here.";
    list.append(empty);
    return;
  }

  conversations.forEach(conversation => {
    const item = document.createElement("div");
    item.className = "history-item";

    const open = document.createElement("button");
    open.className = "history-title";
    open.textContent = conversation.title || "Conversation";
    open.title = conversation.title || "Conversation";
    open.addEventListener("click", () => openConversation(conversation.id));

    const actions = document.createElement("div");
    actions.className = "history-actions";

    const rename = document.createElement("button");
    rename.className = "btn";
    rename.textContent = "Rename";
    rename.addEventListener("click", () => {
      const next = prompt("Conversation name:", conversation.title || "");
      if (next && next.trim()) {
        conversation.title = next.trim().slice(0, 100);
        persistHistory();
        renderHistory();
      }
    });

    const remove = document.createElement("button");
    remove.className = "btn";
    remove.textContent = "Delete";
    remove.addEventListener("click", () => {
      conversations = conversations.filter(item => item.id !== conversation.id);
      if (currentId === conversation.id) startNewChat();
      persistHistory();
      renderHistory();
    });

    actions.append(rename, remove);
    item.append(open, actions);
    list.append(item);
  });
}

function openConversation(id) {
  const conversation = conversations.find(item => item.id === id);
  if (!conversation) return;

  currentId = conversation.id;
  messages = Array.isArray(conversation.messages)
    ? conversation.messages.map(message => ({
        role: message.role,
        content: String(message.content ?? ""),
        time: message.time || Date.now()
      }))
    : [];

  updateMode(instructions[conversation.mode] ? conversation.mode : "chat");
  $("chatMessages").replaceChildren();

  if (!messages.length) {
    showWelcome();
  } else {
    messages.forEach(message => {
      const row = document.createElement("div");
      row.className = "message-row " + (message.role === "user" ? "user" : "assistant");
      const bubble = document.createElement("div");
      bubble.className = "message " + (message.role === "user" ? "user" : "assistant");
      const label = document.createElement("div");
      label.className = "message-label";
      label.textContent = message.role === "user" ? "YOU" : "AI GENIUS";
      const body = document.createElement("div");
      body.className = "message-content";
      body.textContent = message.content;
      bubble.append(label, body);
      row.append(bubble);
      $("chatMessages").append(row);
    });
    const lastAssistant = [...messages].reverse().find(item => item.role === "assistant");
    lastReply = lastAssistant ? lastAssistant.content : "";
    $("chatMessages").scrollTop = $("chatMessages").scrollHeight;
  }

  closeSidebar();
}

function startNewChat() {
  currentId = createId();
  messages = [];
  lastReply = "";
  $("prompt").value = "";
  showWelcome();
  updateMode("chat");
  setStatus("Ready when you are.");
  closeSidebar();
}

async function sendMessage() {
  if (busy) return;

  const text = $("prompt").value.trim();
  if (!text) {
    $("prompt").focus();
    return;
  }

  const submittedMode = mode;
  $("prompt").value = "";
  addMessage("user", text);
  busy = true;
  $("sendBtn").disabled = true;
  $("sendBtn").textContent = "…";
  setStatus("AI Genius is thinking…");

  const pendingRow = document.createElement("div");
  pendingRow.className = "message-row assistant";
  pendingRow.id = "pendingMessage";

  const pendingBubble = document.createElement("div");
  pendingBubble.className = "message assistant";
  pendingBubble.textContent = "Thinking…";
  pendingRow.append(pendingBubble);
  $("chatMessages").append(pendingRow);
  $("chatMessages").scrollTop = $("chatMessages").scrollHeight;

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: (instructions[submittedMode] || "") + text,
        mode: submittedMode
      })
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(data.error || data.message || "Request failed (" + response.status + ").");
    }

    const reply = data.reply ?? data.response ?? data.output ?? data.text;
    if (reply === undefined || reply === null || String(reply).trim() === "") {
      throw new Error(data.error || "The AI service returned an empty response.");
    }

    pendingRow.remove();
    addMessage("assistant", String(reply));
    setStatus("Reply received.");
  } catch (error) {
    pendingRow.remove();
    addMessage(
      "assistant",
      "Sorry, I couldn't get a response. Please check your connection and try again.\n\nDetails: " +
      (error.message || "Unknown error")
    );
    setStatus("Request failed.");
  } finally {
    busy = false;
    $("sendBtn").disabled = false;
    $("sendBtn").textContent = "Send ↑";
    $("prompt").focus();
  }
}

function exportHistory() {
  const data = {
    exportedAt: new Date().toISOString(),
    conversations
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "ai-genius-conversations.json";
  link.click();
  URL.revokeObjectURL(url);
  setStatus("Conversation export prepared.");
}

function clearHistory() {
  if (!confirm("Delete all saved conversations? This cannot be undone.")) return;
  conversations = [];
  persistHistory();
  renderHistory();
  startNewChat();
  setStatus("Saved conversations cleared.");
}

function speakLastReply() {
  if (!lastReply) {
    setStatus("There is no assistant reply to read yet.");
    return;
  }
  if (!("speechSynthesis" in window)) {
    setStatus("Speech output is not supported in this browser.");
    return;
  }
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(lastReply);
  utterance.lang = $("language").value;
  utterance.rate = Number($("voiceRate").value) || 1;
  speechSynthesis.speak(utterance);
}

function startVoiceInput() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    setStatus("Voice input is not supported in this browser. You can type your message.");
    return;
  }

  if (recognition) {
    recognition.stop();
    recognition = null;
    $("micBtn").textContent = "🎙️";
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = $("language").value;
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = () => {
    $("micBtn").textContent = "⏹";
    setStatus("Listening… Speak now.");
  };

  recognition.onresult = event => {
    let transcript = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    $("prompt").value = transcript;
  };

  recognition.onerror = event => {
    setStatus("Voice input error: " + event.error);
  };

  recognition.onend = () => {
    recognition = null;
    $("micBtn").textContent = "🎙️";
    if ($("status").textContent === "Listening… Speak now.") {
      setStatus("Voice input finished.");
    }
  };

  try {
    recognition.start();
  } catch {
    recognition = null;
    $("micBtn").textContent = "🎙️";
    setStatus("Could not start voice input.");
  }
}

$("menuBtn").addEventListener("click", toggleSidebar);
$("overlay").addEventListener("click", closeSidebar);
$("newChat").addEventListener("click", startNewChat);
$("headerNewChat").addEventListener("click", startNewChat);
$("sendBtn").addEventListener("click", sendMessage);
$("micBtn").addEventListener("click", startVoiceInput);
$("clearBtn").addEventListener("click", () => {
  $("prompt").value = "";
  $("prompt").focus();
});
$("historyJump").addEventListener("click", () => {
  $("historyList").scrollIntoView({ behavior: "smooth", block: "start" });
});
$("exportHistory").addEventListener("click", exportHistory);
$("clearHistory").addEventListener("click", clearHistory);
$("speakReply").addEventListener("click", speakLastReply);
$("stopVoice").addEventListener("click", () => {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  setStatus("Speech stopped.");
});

document.querySelectorAll(".tool").forEach(button => {
  button.addEventListener("click", () => updateMode(button.dataset.mode));
});

$("prompt").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

$("themeBtn").addEventListener("click", () => {
  document.body.classList.toggle("light");
  const light = document.body.classList.contains("light");
  $("themeBtn").textContent = light ? "🌙" : "☀️";
  try {
    localStorage.setItem("aiGeniusTheme", light ? "light" : "dark");
  } catch {}
});

try {
  if (localStorage.getItem("aiGeniusTheme") === "light") {
    document.body.classList.add("light");
    $("themeBtn").textContent = "🌙";
  }
} catch {}

renderHistory();
showWelcome();
})();
</script>
</body>
</html>
